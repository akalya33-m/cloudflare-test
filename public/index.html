<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iyattral Technologies - Attendance Intelligence</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
      color: #334155;
    }
    header {
      background-color: #0f172a;
      color: white;
      padding: 20px 40px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .card-header {
      padding: 20px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .raw-display {
      padding: 20px;
      font-family: monospace;
      background: #f8fafc;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 13px;
      color: #0f172a;
      min-height: 200px;
    }
    .status-badge {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-loading { background: #fef08a; color: #854d0e; }
    .status-success { background: #dcfce7; color: #166534; }
    .status-error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <header>
    <h1>IYATTRAL TECHNOLOGIES</h1>
    <p>Biometric Attendance Intelligence Portal</p>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <span>📊 Live Extraction from save_log.php</span>
        <span id="syncStatus" class="status-badge status-loading">Connecting...</span>
      </div>
      
      <div id="outputArea" class="raw-display">
        Fetching live data directly from save_log.php...
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const outputArea = document.getElementById("outputArea");
      const syncStatus = document.getElementById("syncStatus");

      try {
        // 1. Direct browser fetch from your PHP endpoint
        const response = await fetch('https://iyattraltechnologies.com/save_log.php', {
          method: 'GET',
          mode: 'cors'
        });

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const rawText = await response.text();

        if (!rawText || rawText.trim() === "") {
          outputArea.textContent = "Extraction Warning: save_log.php returned empty data.";
          syncStatus.textContent = "Empty Data";
          syncStatus.className = "status-badge status-error";
          return;
        }

        // 2. Display the exact extracted text on screen
        outputArea.textContent = rawText;
        syncStatus.textContent = "Extracted & Synced Successfully";
        syncStatus.className = "status-badge status-success";

        // 3. Automatically store the extracted data into Cloudflare KV via backend function
        await fetch('/api/store-logs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ logs: rawText })
        });

      } catch (error) {
        console.error("Extraction Error:", error);
        outputArea.textContent = `Direct fetch failed: ${error.message}\n\nNote: If this is a CORS error, please ensure that your Hostinger PHP server allows cross-origin requests from your Cloudflare domain.`;
        syncStatus.textContent = "Failed";
        syncStatus.className = "status-badge status-error";
      }
    });
  </script>

</body>
</html>
