<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Source Inspector</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    #status { color: #94a3b8; font-size: 14px; }
    pre {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2 style="margin:0;">Extracted Source: iyattid.iyattraltechnologies.com</h2>
      <span id="status">Fetching server-to-server...</span>
    </div>
    <button onclick="copyCode()">Copy Code</button>
  </div>

  <pre id="code-box">Loading...</pre>

  <script>
    async function loadSource() {
      const statusEl = document.getElementById("status");
      const codeBox = document.getElementById("code-box");

      try {
        const res = await fetch("/api/fetch-logs");
        const data = await res.json();

        statusEl.textContent = `HTTP Status: ${data.status || "Error"} | Success: ${data.success}`;
        // textContent safely renders raw HTML tags as readable text instead of executing them
        codeBox.textContent = data.source_code || data.error || "No response body returned.";
      } catch (err) {
        statusEl.textContent = "Fetch Failed";
        codeBox.textContent = err.message;
      }
    }

    function copyCode() {
      const text = document.getElementById("code-box").textContent;
      navigator.clipboard.writeText(text);
      alert("Source code copied to clipboard!");
    }

    loadSource();
  </script>

</body>
</html>
