<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iyattral Technologies - Attendance Intelligence</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f1f5f9; padding: 20px; color: #334155; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
    .raw-display { font-family: monospace; background: #f8fafc; padding: 15px; white-space: pre-wrap; word-break: break-all; margin-top: 15px; border-radius: 4px; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📊 Attendance Logs (Via Cloudflare Proxy)</h2>
    <p id="status">Fetching data through Cloudflare serverless proxy...</p>
    <div id="outputArea" class="raw-display">Loading...</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const outputArea = document.getElementById("outputArea");
      const statusText = document.getElementById("status");

      try {
        // Fetch from your own Cloudflare backend function instead of Hostinger directly
        const res = await fetch('/api/fetch-logs');
        const data = await res.json();

        if (data.success) {
          outputArea.textContent = data.logs;
          statusText.textContent = "Status: Successfully synced & displayed!";
          statusText.style.color = "green";
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        outputArea.textContent = `Error: ${err.message}`;
        statusText.textContent = "Status: Failed to retrieve logs.";
        statusText.style.color = "red";
      }
    });
  </script>

</body>
</html>
